# Fast checks on every pull request and on main, on Linux.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Required files
        run: |
          for f in README.md LICENSE CHANGELOG.md SECURITY.md CONTRIBUTING.md CODE_OF_CONDUCT.md; do
            test -f "$f" || { echo "::error file=$f::$f is missing"; exit 1; }
          done

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      # Swing GUI: compiling is the meaningful check on a headless runner.
      - name: Compile
        run: javac -encoding UTF-8 -d out src/*.java

  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Secrets (gitleaks)
        run: |
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.21.2 \
            dir /repo --no-banner --redact
